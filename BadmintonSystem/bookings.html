<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>การจอง - ระบบจองสนามแบดมินตัน</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
body{background:#f3f5f7}
.sidebar{min-height:100vh;background:#198754}
.sidebar a{display:block;color:#fff;text-decoration:none;padding:12px}
.sidebar a:hover{background:#157347}
.sidebar a.active{background:#0f5132;font-weight:bold}
.section,.card{border:none;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.section{background:#fff;padding:20px;margin:25px 0}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-success">
<div class="container-fluid">
<span class="navbar-brand">🏸 ระบบจองสนามแบดมินตัน</span>
</div>
</nav>

<div class="container-fluid">
<div class="row">
<div class="col-md-2 sidebar p-0">
<h4 class="text-white text-center py-3">MENU</h4>
<a href="index.html">Dashboard</a>
<a href="customers.html">ลูกค้า</a>
<a href="courts.html">สนาม</a>
<a href="bookings.html" class="active">การจอง</a>
<a href="payments.html">ชำระเงิน</a>
</div>

<div class="col-md-10 p-4">
<div class="section">
<h3>📅 จองสนาม</h3>
<div class="row g-2">
<div class="col"><select id="bookingCustomer" class="form-select"><option value="">ลูกค้า</option></select></div>
<div class="col"><select id="bookingCourt" class="form-select"><option value="">สนาม</option></select></div>
<div class="col"><input id="bookingDate" type="date" class="form-control"></div>
<div class="col"><input id="bookingStart" type="time" class="form-control"></div>
<div class="col"><input id="bookingEnd" type="time" class="form-control"></div>
<div class="col-auto"><button class="btn btn-success" type="button" onclick="addBooking()">บันทึก</button></div>
</div>

<table class="table table-striped mt-3">
<thead><tr><th>ID</th><th>ลูกค้า</th><th>สนาม</th><th>วันที่</th><th>เวลา</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
<tbody id="bookingTable"></tbody>
</table>
</div>
</div>
</div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title" id="editModalTitle">แก้ไขข้อมูล</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body" id="editModalBody"></div>
<div class="modal-footer">
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
<button type="button" class="btn btn-success" id="editModalSaveBtn">บันทึก</button>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tfwtvgjderlkqdnxpzkn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_WJuURBkSedB8D4Cv6eGQ_g_l20bBrWW";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let editModalInstance;
let allCustomers = [];
let allCourts = [];
let allBookings = [];

document.addEventListener("DOMContentLoaded", () => {
  editModalInstance = new bootstrap.Modal(document.getElementById("editModal"));
});

function openEditModal(title, fields, onSave) {
  document.getElementById("editModalTitle").innerText = title;
  const body = document.getElementById("editModalBody");
  body.innerHTML = fields.map(f => {
    if (f.type === "select") {
      const opts = f.options.map(o =>
        `<option value="${o.value}" ${o.value === f.value ? "selected" : ""}>${o.label}</option>`
      ).join("");
      return `<div class="mb-2"><label class="form-label">${f.label}</label>
        <select class="form-select" id="edit_${f.id}">${opts}</select></div>`;
    }
    return `<div class="mb-2"><label class="form-label">${f.label}</label>
      <input class="form-control" id="edit_${f.id}" type="${f.type || "text"}" value="${f.value ?? ""}"></div>`;
  }).join("");

  const saveBtn = document.getElementById("editModalSaveBtn");
  const newBtn = saveBtn.cloneNode(true);
  saveBtn.parentNode.replaceChild(newBtn, saveBtn);

  newBtn.addEventListener("click", async () => {
    const values = {};
    fields.forEach(f => { values[f.id] = document.getElementById(`edit_${f.id}`).value; });
    await onSave(values);
    editModalInstance.hide();
  });

  editModalInstance.show();
}

async function loadLookups() {
  const [{ data: customers }, { data: courts }] = await Promise.all([
    db.from("customers").select("customer_id, full_name").order("customer_id"),
    db.from("courts").select("court_id, court_name").order("court_id"),
  ]);
  allCustomers = customers || [];
  allCourts = courts || [];

  document.getElementById("bookingCustomer").innerHTML = `<option value="">ลูกค้า</option>` +
    allCustomers.map(c => `<option value="${c.customer_id}">${c.full_name}</option>`).join("");
  document.getElementById("bookingCourt").innerHTML = `<option value="">สนาม</option>` +
    allCourts.map(c => `<option value="${c.court_id}">${c.court_name}</option>`).join("");
}

async function loadBookings() {
  const { data, error } = await db
    .from("bookings")
    .select("booking_id, customer_id, court_id, booking_date, start_time, end_time, booking_status, customers(full_name), courts(court_name)")
    .order("booking_id", { ascending: true });

  if (error) { alert(error.message); return; }
  allBookings = data;

  document.getElementById("bookingTable").innerHTML = data.map(item => `
    <tr>
      <td>${item.booking_id}</td>
      <td>${item.customers?.full_name ?? item.customer_id}</td>
      <td>${item.courts?.court_name ?? item.court_id}</td>
      <td>${item.booking_date}</td>
      <td>${item.start_time} - ${item.end_time}</td>
      <td>${item.booking_status ?? "รอชำระ"}</td>
      <td>
        <button class="btn btn-primary btn-sm" type="button" onclick="editBooking(${item.booking_id})">แก้ไข</button>
        <button class="btn btn-danger btn-sm" type="button" onclick="deleteBooking(${item.booking_id})">ลบ</button>
      </td>
    </tr>
  `).join("");
}

async function addBooking() {
  const customer_id = document.getElementById("bookingCustomer").value;
  const court_id = document.getElementById("bookingCourt").value;
  const booking_date = document.getElementById("bookingDate").value;
  const start_time = document.getElementById("bookingStart").value;
  const end_time = document.getElementById("bookingEnd").value;

  if (!customer_id || !court_id || !booking_date || !start_time || !end_time) {
    alert("กรุณากรอกข้อมูลให้ครบ");
    return;
  }

  const { error } = await db.from("bookings").insert({
    customer_id: Number(customer_id),
    court_id: Number(court_id),
    booking_date,
    start_time,
    end_time,
    booking_status: "รอชำระ"
  });
  if (error) { alert("บันทึกไม่สำเร็จ: " + error.message); return; }

  loadBookings();
}

function editBooking(booking_id) {
  const b = allBookings.find(x => x.booking_id === booking_id);
  if (!b) return;
  openEditModal("แก้ไขการจอง", [
    { id: "customer_id", label: "ลูกค้า", value: b.customer_id, type: "select",
      options: allCustomers.map(c => ({ value: c.customer_id, label: c.full_name })) },
    { id: "court_id", label: "สนาม", value: b.court_id, type: "select",
      options: allCourts.map(c => ({ value: c.court_id, label: c.court_name })) },
    { id: "booking_date", label: "วันที่", value: b.booking_date, type: "date" },
    { id: "start_time", label: "เวลาเริ่ม", value: b.start_time, type: "time" },
    { id: "end_time", label: "เวลาสิ้นสุด", value: b.end_time, type: "time" },
    { id: "status", label: "สถานะ", value: b.booking_status ?? "รอชำระ", type: "select",
      options: [{ value: "รอชำระ", label: "รอชำระ" }, { value: "จองแล้ว", label: "จองแล้ว" }, { value: "ยกเลิก", label: "ยกเลิก" }, { value: "เสร็จสิ้น", label: "เสร็จสิ้น" }] },
  ], async (v) => {
    const { error } = await db.from("bookings")
      .update({
        customer_id: Number(v.customer_id),
        court_id: Number(v.court_id),
        booking_date: v.booking_date,
        start_time: v.start_time,
        end_time: v.end_time,
        booking_status: v.status
      })
      .eq("booking_id", booking_id);
    if (error) { alert("แก้ไขไม่สำเร็จ: " + error.message); return; }
    loadBookings();
  });
}

async function deleteBooking(booking_id) {
  if (!confirm(`ยืนยันลบ booking_id = ${booking_id} ?`)) return;
  const { error } = await db.from("bookings").delete().eq("booking_id", booking_id);
  if (error) { alert("ลบไม่สำเร็จ: " + error.message); return; }
  loadBookings();
}

window.addBooking = addBooking;
window.editBooking = editBooking;
window.deleteBooking = deleteBooking;

(async function init() {
  await loadLookups();
  await loadBookings();
})();
</script>
</body>
</html>
