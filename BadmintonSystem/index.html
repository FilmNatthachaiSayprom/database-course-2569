<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dashboard - ระบบจองสนามแบดมินตัน</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
body{background:#f3f5f7}
.sidebar{min-height:100vh;background:#198754}
.sidebar a{display:block;color:#fff;text-decoration:none;padding:12px}
.sidebar a:hover{background:#157347}
.sidebar a.active{background:#0f5132;font-weight:bold}
.section,.card{border:none;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.section{background:#fff;padding:20px;margin:25px 0}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-success">
<div class="container-fluid">
<span class="navbar-brand">🏸 ระบบจองสนามแบดมินตัน</span>
</div>
</nav>

<div class="container-fluid">
<div class="row">
<div class="col-md-2 sidebar p-0">
<h4 class="text-white text-center py-3">MENU</h4>
<a href="index.html" class="active">Dashboard</a>
<a href="customers.html">ลูกค้า</a>
<a href="courts.html">สนาม</a>
<a href="bookings.html">การจอง</a>
<a href="payments.html">ชำระเงิน</a>
</div>

<div class="col-md-10 p-4">
<h2>Dashboard</h2>

<div class="row g-3">
<div class="col-md-3"><div class="card p-3 text-center"><h2 id="statCustomers">-</h2><p>ลูกค้า</p></div></div>
<div class="col-md-3"><div class="card p-3 text-center"><h2 id="statCourts">-</h2><p>สนาม</p></div></div>
<div class="col-md-3"><div class="card p-3 text-center"><h2 id="statBookings">-</h2><p>การจอง</p></div></div>
<div class="col-md-3"><div class="card p-3 text-center"><h2 id="statRevenue">-</h2><p>รายได้ (บาท)</p></div></div>
</div>

<div class="section">
<h3>📅 การจองล่าสุด</h3>
<table class="table table-striped mt-3">
<thead><tr><th>ID</th><th>ลูกค้า</th><th>สนาม</th><th>วันที่</th><th>เวลา</th><th>สถานะ</th></tr></thead>
<tbody id="recentBookings"></tbody>
</table>
</div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tfwtvgjderlkqdnxpzkn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_WJuURBkSedB8D4Cv6eGQ_g_l20bBrWW";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadDashboard() {
  const [{ count: customerCount }, { count: courtCount }, { count: bookingCount }, bookingsRes, paymentsRes] = await Promise.all([
    db.from("customers").select("*", { count: "exact", head: true }),
    db.from("courts").select("*", { count: "exact", head: true }),
    db.from("bookings").select("*", { count: "exact", head: true }),
    db.from("bookings")
      .select("booking_id, booking_date, start_time, end_time, booking_status, customers(full_name), courts(court_name)")
      .order("booking_id", { ascending: false })
      .limit(10),
    db.from("payments").select("amount")
  ]);

  document.getElementById("statCustomers").innerText = customerCount ?? 0;
  document.getElementById("statCourts").innerText = courtCount ?? 0;

  const bookings = bookingsRes.data || [];
  document.getElementById("statBookings").innerText = bookingCount ?? 0;

  const totalRevenue = (paymentsRes.data || []).reduce((sum, p) => sum + Number(p.amount || 0), 0);
  document.getElementById("statRevenue").innerText = totalRevenue.toLocaleString("th-TH");

  document.getElementById("recentBookings").innerHTML = bookings.map(b => `
    <tr>
      <td>${b.booking_id}</td>
      <td>${b.customers?.full_name ?? ""}</td>
      <td>${b.courts?.court_name ?? ""}</td>
      <td>${b.booking_date}</td>
      <td>${b.start_time} - ${b.end_time}</td>
      <td>${b.booking_status ?? "รอชำระ"}</td>
    </tr>
  `).join("");
}

loadDashboard();
</script>
</body>
</html>
