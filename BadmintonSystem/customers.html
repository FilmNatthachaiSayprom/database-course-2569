<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ลูกค้า - ระบบจองสนามแบดมินตัน</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
body{background:#f3f5f7}
.sidebar{min-height:100vh;background:#198754}
.sidebar a{display:block;color:#fff;text-decoration:none;padding:12px}
.sidebar a:hover{background:#157347}
.sidebar a.active{background:#0f5132;font-weight:bold}
.section,.card{border:none;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.section{background:#fff;padding:20px;margin:25px 0}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-success">
<div class="container-fluid">
<span class="navbar-brand">🏸 ระบบจองสนามแบดมินตัน</span>
</div>
</nav>

<div class="container-fluid">
<div class="row">
<div class="col-md-2 sidebar p-0">
<h4 class="text-white text-center py-3">MENU</h4>
<a href="index.html">Dashboard</a>
<a href="customers.html" class="active">ลูกค้า</a>
<a href="courts.html">สนาม</a>
<a href="bookings.html">การจอง</a>
<a href="payments.html">ชำระเงิน</a>
</div>

<div class="col-md-10 p-4">
<div class="section">
<h3>👤 จัดการลูกค้า</h3>

<div class="row g-2">
<div class="col"><input id="name" class="form-control" placeholder="ชื่อ" /></div>
<div class="col"><input id="phone" class="form-control" placeholder="เบอร์" /></div>
<div class="col"><input id="email" class="form-control" placeholder="Email" /></div>
<div class="col-auto"><button class="btn btn-success" type="button" onclick="addCustomer()">เพิ่ม</button></div>
</div>

<table class="table table-striped mt-3">
<thead><tr><th>ID</th><th>ชื่อ</th><th>เบอร์</th><th>Email</th><th>จัดการ</th></tr></thead>
<tbody id="customerTable"></tbody>
</table>
</div>
</div>
</div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title" id="editModalTitle">แก้ไขข้อมูล</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body" id="editModalBody"></div>
<div class="modal-footer">
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
<button type="button" class="btn btn-success" id="editModalSaveBtn">บันทึก</button>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tfwtvgjderlkqdnxpzkn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_WJuURBkSedB8D4Cv6eGQ_g_l20bBrWW";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let editModalInstance;
let allCustomers = [];

document.addEventListener("DOMContentLoaded", () => {
  editModalInstance = new bootstrap.Modal(document.getElementById("editModal"));
});

function openEditModal(title, fields, onSave) {
  document.getElementById("editModalTitle").innerText = title;
  const body = document.getElementById("editModalBody");
  body.innerHTML = fields.map(f => {
    if (f.type === "select") {
      const opts = f.options.map(o =>
        `<option value="${o.value}" ${o.value === f.value ? "selected" : ""}>${o.label}</option>`
      ).join("");
      return `<div class="mb-2"><label class="form-label">${f.label}</label>
        <select class="form-select" id="edit_${f.id}">${opts}</select></div>`;
    }
    return `<div class="mb-2"><label class="form-label">${f.label}</label>
      <input class="form-control" id="edit_${f.id}" type="${f.type || "text"}" value="${f.value ?? ""}"></div>`;
  }).join("");

  const saveBtn = document.getElementById("editModalSaveBtn");
  const newBtn = saveBtn.cloneNode(true);
  saveBtn.parentNode.replaceChild(newBtn, saveBtn);

  newBtn.addEventListener("click", async () => {
    const values = {};
    fields.forEach(f => { values[f.id] = document.getElementById(`edit_${f.id}`).value; });
    await onSave(values);
    editModalInstance.hide();
  });

  editModalInstance.show();
}

async function loadCustomers() {
  const { data, error } = await db
    .from("customers")
    .select("customer_id, full_name, phone, email")
    .order("customer_id", { ascending: true });

  if (error) { alert(error.message); return; }
  allCustomers = data;

  document.getElementById("customerTable").innerHTML = data.map(item => `
    <tr>
      <td>${item.customer_id}</td>
      <td>${item.full_name}</td>
      <td>${item.phone ?? ""}</td>
      <td>${item.email ?? ""}</td>
      <td>
        <button class="btn btn-primary btn-sm" type="button" onclick="editCustomer(${item.customer_id})">แก้ไข</button>
        <button class="btn btn-danger btn-sm" type="button" onclick="deleteCustomer(${item.customer_id})">ลบ</button>
      </td>
    </tr>
  `).join("");
}

async function addCustomer() {
  const full_name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();

  if (!full_name || !email) { alert("กรุณากรอกชื่อและ email"); return; }

  const { error } = await db.from("customers").insert({ full_name, phone, email });
  if (error) { alert("เพิ่มไม่สำเร็จ: " + error.message); return; }

  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("email").value = "";
  loadCustomers();
}

function editCustomer(customer_id) {
  const c = allCustomers.find(x => x.customer_id === customer_id);
  if (!c) return;
  openEditModal("แก้ไขลูกค้า", [
    { id: "full_name", label: "ชื่อ", value: c.full_name },
    { id: "phone", label: "เบอร์", value: c.phone },
    { id: "email", label: "Email", value: c.email },
  ], async (v) => {
    if (!v.full_name || !v.email) { alert("กรุณากรอกชื่อและ email"); return; }
    const { error } = await db.from("customers")
      .update({ full_name: v.full_name, phone: v.phone, email: v.email })
      .eq("customer_id", customer_id);
    if (error) { alert("แก้ไขไม่สำเร็จ: " + error.message); return; }
    loadCustomers();
  });
}

async function deleteCustomer(customer_id) {
  if (!confirm(`ยืนยันลบ customer_id = ${customer_id} ?`)) return;
  const { error } = await db.from("customers").delete().eq("customer_id", customer_id);
  if (error) { alert("ลบไม่สำเร็จ: " + error.message); return; }
  loadCustomers();
}

window.addCustomer = addCustomer;
window.editCustomer = editCustomer;
window.deleteCustomer = deleteCustomer;

loadCustomers();
</script>
</body>
</html>
