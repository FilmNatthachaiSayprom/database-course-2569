<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ชำระเงิน - ระบบจองสนามแบดมินตัน</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
body{background:#f3f5f7}
.sidebar{min-height:100vh;background:#198754}
.sidebar a{display:block;color:#fff;text-decoration:none;padding:12px}
.sidebar a:hover{background:#157347}
.sidebar a.active{background:#0f5132;font-weight:bold}
.section,.card{border:none;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.section{background:#fff;padding:20px;margin:25px 0}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-success">
<div class="container-fluid">
<span class="navbar-brand">🏸 ระบบจองสนามแบดมินตัน</span>
</div>
</nav>

<div class="container-fluid">
<div class="row">
<div class="col-md-2 sidebar p-0">
<h4 class="text-white text-center py-3">MENU</h4>
<a href="index.html">Dashboard</a>
<a href="customers.html">ลูกค้า</a>
<a href="courts.html">สนาม</a>
<a href="bookings.html">การจอง</a>
<a href="payments.html" class="active">ชำระเงิน</a>
</div>

<div class="col-md-10 p-4">
<div class="section">
<h3>💳 ชำระเงิน</h3>
<div class="row g-2">
<div class="col"><select id="paymentBooking" class="form-select"><option value="">Booking</option></select></div>
<div class="col"><input id="paymentAmount" type="number" class="form-control" placeholder="จำนวนเงิน"></div>
<div class="col">
<select id="paymentMethod" class="form-select">
<option value="เงินสด">เงินสด</option>
<option value="พร้อมเพย์">พร้อมเพย์</option>
</select>
</div>
<div class="col-auto"><button class="btn btn-success" type="button" onclick="addPayment()">ชำระเงิน</button></div>
</div>

<table class="table table-striped mt-3">
<thead><tr><th>ID</th><th>Booking</th><th>จำนวนเงิน</th><th>วิธี</th><th>วันที่</th><th>จัดการ</th></tr></thead>
<tbody id="paymentTable"></tbody>
</table>
</div>
</div>
</div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title" id="editModalTitle">แก้ไขข้อมูล</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body" id="editModalBody"></div>
<div class="modal-footer">
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
<button type="button" class="btn btn-success" id="editModalSaveBtn">บันทึก</button>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tfwtvgjderlkqdnxpzkn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_WJuURBkSedB8D4Cv6eGQ_g_l20bBrWW";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let editModalInstance;
let allBookings = [];
let allPayments = [];

document.addEventListener("DOMContentLoaded", () => {
  editModalInstance = new bootstrap.Modal(document.getElementById("editModal"));
});

function openEditModal(title, fields, onSave) {
  document.getElementById("editModalTitle").innerText = title;
  const body = document.getElementById("editModalBody");
  body.innerHTML = fields.map(f => {
    if (f.type === "select") {
      const opts = f.options.map(o =>
        `<option value="${o.value}" ${o.value === f.value ? "selected" : ""}>${o.label}</option>`
      ).join("");
      return `<div class="mb-2"><label class="form-label">${f.label}</label>
        <select class="form-select" id="edit_${f.id}">${opts}</select></div>`;
    }
    return `<div class="mb-2"><label class="form-label">${f.label}</label>
      <input class="form-control" id="edit_${f.id}" type="${f.type || "text"}" value="${f.value ?? ""}"></div>`;
  }).join("");

  const saveBtn = document.getElementById("editModalSaveBtn");
  const newBtn = saveBtn.cloneNode(true);
  saveBtn.parentNode.replaceChild(newBtn, saveBtn);

  newBtn.addEventListener("click", async () => {
    const values = {};
    fields.forEach(f => { values[f.id] = document.getElementById(`edit_${f.id}`).value; });
    await onSave(values);
    editModalInstance.hide();
  });

  editModalInstance.show();
}

async function loadBookingLookup() {
  const { data } = await db.from("bookings").select("booking_id, booking_date, customers(full_name)").order("booking_id");
  allBookings = data || [];
  document.getElementById("paymentBooking").innerHTML = `<option value="">Booking</option>` +
    allBookings.map(b => `<option value="${b.booking_id}">#${b.booking_id} - ${b.customers?.full_name ?? ""} (${b.booking_date})</option>`).join("");
}

async function loadPayments() {
  const { data, error } = await db
    .from("payments")
    .select("payment_id, booking_id, amount, payment_method, payment_date, payment_status")
    .order("payment_id", { ascending: true });

  if (error) { alert(error.message); return; }
  allPayments = data;

  document.getElementById("paymentTable").innerHTML = data.map(item => `
    <tr>
      <td>${item.payment_id}</td>
      <td>#${item.booking_id}</td>
      <td>${item.amount}</td>
      <td>${item.payment_method}</td>
      <td>${item.payment_date ? new Date(item.payment_date).toLocaleDateString("th-TH") : ""}</td>
      <td>
        <button class="btn btn-primary btn-sm" type="button" onclick="editPayment(${item.payment_id})">แก้ไข</button>
        <button class="btn btn-danger btn-sm" type="button" onclick="deletePayment(${item.payment_id})">ลบ</button>
      </td>
    </tr>
  `).join("");
}

async function addPayment() {
  const booking_id = document.getElementById("paymentBooking").value;
  const amount = document.getElementById("paymentAmount").value;
  const method = document.getElementById("paymentMethod").value;

  if (!booking_id || !amount) { alert("กรุณาเลือก booking และกรอกจำนวนเงิน"); return; }

  const { error } = await db.from("payments").insert({
    booking_id: Number(booking_id),
    amount: Number(amount),
    payment_method: method,
    payment_status: "ชำระแล้ว"
  });
  if (error) { alert("ชำระเงินไม่สำเร็จ: " + error.message); return; }

  document.getElementById("paymentAmount").value = "";
  loadPayments();
}

function editPayment(payment_id) {
  const p = allPayments.find(x => x.payment_id === payment_id);
  if (!p) return;
  openEditModal("แก้ไขการชำระเงิน", [
    { id: "booking_id", label: "Booking", value: p.booking_id, type: "select",
      options: allBookings.map(b => ({ value: b.booking_id, label: `#${b.booking_id}` })) },
    { id: "amount", label: "จำนวนเงิน", value: p.amount, type: "number" },
    { id: "method", label: "วิธีชำระเงิน", value: p.payment_method, type: "select",
      options: [{ value: "เงินสด", label: "เงินสด" }, { value: "พร้อมเพย์", label: "พร้อมเพย์" }] },
  ], async (v) => {
    const { error } = await db.from("payments")
      .update({ booking_id: Number(v.booking_id), amount: Number(v.amount), payment_method: v.method })
      .eq("payment_id", payment_id);
    if (error) { alert("แก้ไขไม่สำเร็จ: " + error.message); return; }
    loadPayments();
  });
}

async function deletePayment(payment_id) {
  if (!confirm(`ยืนยันลบ payment_id = ${payment_id} ?`)) return;
  const { error } = await db.from("payments").delete().eq("payment_id", payment_id);
  if (error) { alert("ลบไม่สำเร็จ: " + error.message); return; }
  loadPayments();
}

window.addPayment = addPayment;
window.editPayment = editPayment;
window.deletePayment = deletePayment;

(async function init() {
  await loadBookingLookup();
  await loadPayments();
})();
</script>
</body>
</html>
